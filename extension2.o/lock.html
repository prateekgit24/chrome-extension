<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Locked — Extensive Z</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.08) 0%, transparent 50%);
    }

    .lock-card {
      width: 380px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: 20px;
      padding: 36px 32px 28px;
      box-shadow: var(--shadow);
      animation: fadeInScale 0.35s ease;
    }

    .lock-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .lock-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .lock-domain {
      text-align: center;
      font-size: 14px;
      color: var(--accent-2);
      font-weight: 500;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .lock-subtitle {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .lock-input {
      margin-bottom: 12px;
    }

    .duration-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: block;
    }

    .duration-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .preset-btn {
      padding: 7px 4px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--tx);
      text-align: center;
    }

    .preset-btn:hover,
    .preset-btn.active {
      background: rgba(99,102,241,0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .custom-row input {
      flex: 1;
    }

    .custom-row .unit {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .unlock-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--tx3);
      letter-spacing: 0.02em;
    }

    .unlock-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .unlock-btn:active {
      transform: translateY(0);
    }

    #msg {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
      color: var(--danger);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text);
    }

    .divider {
      position: relative;
      text-align: center;
      margin: 16px 0;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      position: relative;
      background: var(--surface);
      padding: 0 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-chip {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 11px;
    }

    .stat-chip .val {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }

    .stat-chip .lbl {
      color: var(--text-muted);
      margin-top: 2px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }
  </style>
</head>
<body>
  <div class="lock-card" id="lockCard">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Site Locked</div>
    <div class="lock-domain" id="siteName">—</div>
    <div class="lock-subtitle">This site is protected by Extensive Z</div>

    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-chip">
        <span class="val" id="blockCount">0</span>
        <span class="lbl">Visits Blocked</span>
      </div>
      <div class="stat-chip">
        <span class="val" id="lockTime">—</span>
        <span class="lbl">Last Attempt</span>
      </div>
    </div>

    <div class="lock-input">
      <input type="password" id="password" placeholder="Enter master password" autocomplete="off" />
    </div>

    <span class="duration-label">Unlock Duration</span>
    <div class="duration-presets">
      <button class="preset-btn active" data-mins="15">15 min</button>
      <button class="preset-btn" data-mins="30">30 min</button>
      <button class="preset-btn" data-mins="60">1 hour</button>
      <button class="preset-btn" data-mins="0">Custom</button>
    </div>

    <div class="custom-row" id="customRow" style="display:none">
      <input type="number" id="customMins" placeholder="Minutes" min="1" max="1440" />
      <span class="unit">minutes</span>
    </div>

    <button class="unlock-btn" id="unlockBtn">Unlock Site</button>
    <div id="msg"></div>

    <a href="javascript:history.back()" class="back-link">← Go back</a>
  </div>

  <script src="lock.js"></script>
</body>
</html>
